# decnetd.conf -- a DECnet node for PathNoWorks to drive.
#
# This makes your Linux machine a Phase IV endnode, linked to one router
# over Multinet (DECnet carried in TCP, the way HECnet nodes link up), with
# the API socket the PathNoWorks tools look for by default.  Change the
# addresses and names to suit, then:
#
#     decnetd --log-level info decnetd.conf
#
# It's what I run on my own desk, give or take the numbers.  Lines
# starting with "#" are comments; the commented-out sections further down
# are the usual things you might want to add.

# ------------------------------------------------------------------ who am I

# This node's address and type.  An endnode is right for a desktop: it
# talks to one router and lets the router worry about the rest of the
# network.  Pick an address nobody else on your network is using; on
# HECnet, ask your area's coordinator for one.
routing 29.151 --type endnode

# ----------------------------------------------------------- names for nodes

# Name yourself, and the nodes you talk to most.  pnw-ncp, pnw-dir and
# friends accept either the name or the address.
node 29.151 PNW
node 29.150 CPPNOD
node 29.157 VAXXY

# The whole HECnet node list, from a local copy.  Uncomment once you have
# one (decnetd --fetch-nodes refreshes caches like this).
# node @/home/richard/decnet/hecnet.dat

# ------------------------------------------------------------------ circuits

# One Multinet circuit to the router, which listens on port 7100.  "--t3"
# is the hello timer, in seconds.  The router needs a matching line:
#     circuit mul-1 Multinet <this machine's IP>:7100:listen
circuit mul-0 Multinet 192.168.10.151:7100:connect --t3 15

# Or, instead of that line (an endnode has exactly one circuit): DECnet
# straight on a wired Ethernet, through libpcap.  decnetd must
# then be built with libpcap-dev installed, and needs the right to send raw
# frames:
#     sudo setcap cap_net_raw,cap_net_admin+eip decnetd
# Wi-Fi won't do for this: DECnet sends from its own AA-00-04-00-... source
# address, and access points drop such frames.  "--mop" also turns on MOP,
# which pnw-mop uses.
# circuit eth-0 Ethernet pcap:eth0 --t3 10 --mop

# ----------------------------------------------------------------- the API

# The door the PathNoWorks tools come in by: a Unix socket at the default
# place they look.  Whoever can open it can act as this node, so mode 600
# keeps it to the user decnetd runs as.  Use 660, and a group, to share it.
api /tmp/decnetapi.sock --mode 600

# ------------------------------------------------------- serving files here

# To let other nodes DIR, COPY and TYPE files on this machine, run
# cppdecnet's dnfal as the File Access Listener, object 17, serving one
# directory.  "rw" lets them write as well; the users file decides who gets
# in (see fal.users next to this file).  Don't put a FAL on HECnet without
# a users file.
# object --number 17 --name FAL --file /usr/local/bin/dnfal --argument /home/richard/decnet/files --argument users=/home/richard/decnet/fal.users

# ---------------------------------------------------------------- watching

# A web page of circuits, adjacencies and counters, handy when something
# won't connect.  Then browse to http://localhost:8100/.
# http --http-port 8100
